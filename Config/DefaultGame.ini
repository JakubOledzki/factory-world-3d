[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Factory World 3D
Description=First-person factory-building client for the Factory World server

[/Script/FactoryWorld3D.FWNetSubsystem]
; Factory World server (same one the 2D game uses)
ServerUrl="ws://localhost:5080/ws"
RequestTimeout=15

[/Script/FactoryWorld3D.FWGameSettings]
; Drawn size of one plot tile (the server tile is 20 m; 4 m keeps belts and machines walkable)
TileSizeCm=400
; Where a player without a plot is offered one (world grid): the Tatra mountains
StarterPlotX=3852
StarterPlotY=357
LogisticsPollSeconds=1
; Volume of all the game's sounds, 0..1 (no settings menu yet)
MasterVolume=1.0
; Forest band above the plot (m); bForestRelativeToPlot=False uses the real Tatra tree line (m above sea level) instead.
; A plot's own height comes with its real terrain (+PlotElevations=(X=,Y=,Meters=) overrides it)
bForestRelativeToPlot=True
ForestTopAbovePlotMeters=150
TreeLineAbovePlotMeters=300
; Dwarf mountain pine belt above the forest top (m)
DwarfPineBandMeters=250
ForestTopMeters=1300
TreeLineMeters=1580

[/Script/UnrealEd.ProjectPackagingSettings]
; Art loaded by path at runtime (FWArt) is not referenced by any map, so cook it explicitly.
; Content/External and Content/ThirdParty are made locally by Tools/setup_assets.ps1 and not in git.
+DirectoriesToAlwaysCook=(Path="/Game/Materials")
+DirectoriesToAlwaysCook=(Path="/Game/External")
+DirectoriesToAlwaysCook=(Path="/Game/ThirdParty")
+DirectoriesToAlwaysCook=(Path="/Game/Environment/Foliage/Trees")
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Mannequins")
; The world map's plot data (Tools/build_world_map.mjs), read as files by the game
+DirectoriesToAlwaysStageAsNonUFS=(Path="External/WorldData")
+MapsToCook=(FilePath="/Game/Maps/TestLevel")
bUseIoStore=True
bShareMaterialShaderCode=True
BuildConfiguration=PPBC_Shipping
